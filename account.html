<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a mentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="overlay">
            <nav class="navbar">
                <div class="nav__logo">
                    <img src="assets/logo.svg">
                </div>
                <div class="nav__search">
                    <form>
                        <input class="searchbar" type="search" placeholder="Search bar">
                        <input type="image" name="submit" class="search__icon" src="assets/search.svg">
                    </form>
                </div>
                <div class="nav__menu">
                    <p>Category</p>
                    <img src="assets/arrow-drop-down.svg">
                </div>
                <p class="nav__text">Become a Mentor</p>
                <div class="profile">
                    <img src="assets/keyboard-arrow-down.svg">
                    <img class="profile__img" src="/">
                    <p>Romadhon@gmail.com</p>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <div class="profile__container">
            <img class="profile__photo" src="/">
            <div class="profile__text-container">
                <h4 class="profile__name">Romadhona Syarifuddin</h4>
                <p class="profile__description">Full Stack Web Designer</p>
            </div>
        </div>
        <nav>
            <div class="nav__list">
                <h4 class="nav__item nav__item--active">My courses</h4>
                <h4 class="nav__item">Wishlist</h4>
                <h4 class="nav__item">My certificate</h4>
            </div>
        </nav>
        <div class="courses">
            <div class="course-card">
                <div class="course-card__image-container">
                    <img class="course-card__img" src="/">
                    <button type="button" class="course-card__button">UI/UX Design</button>
                </div>
                <p class="course-card__header">Interpersonal Skills - Work Better With Others!</p>
                <p class="course-card__description">Tanah Air Team</p>
                <div class="rating">
                    <div class="rating-img">
                        <img src="assets/rating.svg">
                        <img src="assets/rating.svg">
                        <img src="assets/rating.svg">
                        <img src="assets/rating.svg">
                        <img src="assets/rating.svg">
                    </div>
                    <p class="rating-text">(2078)</p>
                </div>
                <div class="price">
                    <s class="strike-price">$640</s>
                    <h6 class="real-price">$384</h6>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
